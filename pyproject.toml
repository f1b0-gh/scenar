[project]
name = "scenar"
version = "0.1.0"
description = "Scenar builds reproducible synthetic security datasets"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "pydantic>=2.12,<3",
    "pyyaml>=6",
]

[project.scripts]
scenar = "scenar.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# Explicit dataset-producer package boundary; no downstream detector implementation.
[tool.hatch.build.targets.sdist]
include = [
    "/src/scenar", "/tests", "/tools", "/examples", "/lib", "/procedures",
    "/generated", "/scenarios", "/packs", "/toolchains", "/docs", "/skills", "/.github",
    "/README.md", "/ACKNOWLEDGEMENTS.md", "/CONTRIBUTING.md", "/LICENSE",
    "/AGENTS.md", "/pyproject.toml", "/uv.lock", "/compose.yaml",
    "/.env.example", "/scenar", "/lookout-scenar",
]
exclude = ["/.local/**", "**/.local/**", "**/__pycache__", "**/*.pyc", "**/*.pyo", "**/.tmp_*", "**/*.log"]

[tool.hatch.build.targets.wheel]
packages = ["src/scenar"]
exclude = ["**/.local/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]


# Exact wheel metadata retained for offline resolution in the build environment.
[[tool.uv.dependency-metadata]]
name = "pydantic-core"
version = "2.50.4"
requires-python = ">=3.10"
requires-dist = ["typing-extensions>=4.16.0"]

[[tool.uv.dependency-metadata]]
name = "PyYAML"
version = "6.0.3"
requires-python = ">=3.8"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "ruff"
version = "0.17.6"
requires-python = ">=3.7"
requires-dist = []

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
