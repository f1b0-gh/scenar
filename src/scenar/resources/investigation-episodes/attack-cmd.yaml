version: '1.0'
name: evidence-led-attack-cmd
description: Synthetic evidence only. RDP -> directory discovery -> archive staging.
  No commands are executed.
environment:
  description: Small insurance branch office with Active Directory, a file server,
    a DMZ web portal, and an explicit forward proxy
  domain: northstar-branch.local
  timezone:
    default: America/New_York
  proxy:
    mode: explicit
    listener_port: 8080
  users:
  - username: maya.patel
    full_name: Maya Patel
    email: maya.patel@northstarclaims.com
    persona: accountant
    primary_system: WS-MPATEL-01
    groups:
    - finance
    enabled: true
    browsing_intensity: normal
  - username: owen.reed
    full_name: Owen Reed
    email: owen.reed@northstarclaims.com
    persona: sales
    primary_system: WS-OREED-01
    groups:
    - sales
    enabled: true
    browsing_intensity: heavy
  - username: lena.morris
    full_name: Lena Morris
    email: lena.morris@northstarclaims.com
    persona: analyst
    primary_system: WS-LMORRIS-01
    groups:
    - claims
    enabled: true
    browsing_intensity: normal
  - username: nina.kapoor
    full_name: Nina Kapoor
    email: nina.kapoor@northstarclaims.com
    persona: sysadmin
    primary_system: WS-NKAPOOR-01
    groups:
    - it-admins
    - domain-admins
    enabled: true
    browsing_intensity: light
  - username: victor.hale
    full_name: Victor Hale
    email: victor.hale@northstarclaims.com
    persona: executive
    primary_system: WS-VHALE-01
    groups:
    - branch-leadership
    enabled: true
    browsing_intensity: normal
  service_accounts:
  - www-data
  - svc-backup
  - svc-proxy
  stale_accounts:
  - username: carla.nunez
    last_active: '2023-11-17'
    reason: Former claims adjuster; cached credentials still referenced by an old
      laptop task
  - username: svc-print-old
    last_active: '2023-08-02'
    reason: Retired print deployment account left in one legacy startup script
  systems:
  - hostname: WS-MPATEL-01
    ip: 10.44.10.21
    os: Windows 11 Enterprise
    type: workstation
    assigned_user: maya.patel
    services:
    - dns-client
  - hostname: WS-OREED-01
    ip: 10.44.10.22
    os: Windows 11 Enterprise
    type: workstation
    assigned_user: owen.reed
    services:
    - dns-client
  - hostname: WS-LMORRIS-01
    ip: 10.44.10.23
    os: Windows 11 Enterprise
    type: workstation
    assigned_user: lena.morris
    services:
    - dns-client
  - hostname: WS-NKAPOOR-01
    ip: 10.44.10.24
    os: Windows 11 Enterprise
    type: workstation
    assigned_user: nina.kapoor
    services:
    - dns-client
  - hostname: WS-VHALE-01
    ip: 10.44.10.25
    os: Windows 11 Enterprise
    type: workstation
    assigned_user: victor.hale
    services:
    - dns-client
  - hostname: DC-BO-01
    ip: 10.44.20.10
    os: Windows Server 2022
    type: domain_controller
    services:
    - kerberos
    - ldap
    - dns
    - windows-dhcp-server
    roles:
    - domain_controller
    - dns_server
    - dhcp_server
  - hostname: FILE-BO-01
    ip: 10.44.20.20
    os: Windows Server 2019
    type: server
    services:
    - smb
    - dfs
    - dns-client
    roles:
    - file_server
  - hostname: PROXY-BO-01
    ip: 10.44.20.30
    os: Ubuntu 22.04 LTS
    type: server
    services:
    - squid
    - dns-client
    roles:
    - forward_proxy
  - hostname: WEB-BO-01
    ip: 10.44.30.10
    os: Ubuntu 22.04 LTS
    type: server
    services:
    - nginx
    - php-fpm
    - ssh
    - dns-client
    roles:
    - web_server
    public_hostnames:
    - portal.northstarclaims.net
  network:
    public_cidrs:
    - 45.83.220.0/28
    segments:
    - name: workstations
      cidr: 10.44.10.0/24
      description: Branch office workstation VLAN
      exposure: internal
      systems:
      - WS-MPATEL-01
      - WS-OREED-01
      - WS-LMORRIS-01
      - WS-NKAPOOR-01
      - WS-VHALE-01
    - name: servers
      cidr: 10.44.20.0/24
      description: Internal server VLAN
      exposure: internal
      systems:
      - DC-BO-01
      - FILE-BO-01
      - PROXY-BO-01
    - name: dmz
      cidr: 10.44.30.0/24
      description: Small DMZ for the public claims portal
      exposure: both
      external_ratio: 0.7
      systems:
      - WEB-BO-01
    sensors:
    - type: network
      name: bo-core-span
      hostname: ZEEK-BO-CORE
      monitoring_segments:
      - workstations
      - servers
      - dmz
      direction: bidirectional
      placement: span
      log_formats:
      - zeek
      description: Core switch SPAN for branch east-west and proxy traffic
    - type: ids
      name: bo-perimeter-ids
      hostname: IDS-BO-EDGE
      monitoring_segments:
      - dmz
      direction: inbound
      placement: tap
      log_formats:
      - snort_alert
      description: Perimeter IDS monitoring inbound DMZ traffic
    - type: firewall
      name: bo-edge-fw
      hostname: FW-BO-EDGE
      monitoring_segments:
      - workstations
      - servers
      - dmz
      direction: bidirectional
      placement: tap
      log_formats:
      - cisco_asa
      interfaces:
        workstations: inside
        servers: inside
        dmz: dmz
      default_action: deny
      deny_ratio: 2.0
      threat_detection_rate: 10
      nat_rules:
      - type: dynamic_pat
        src:
        - workstations
        - servers
        mapped_ip: 45.83.220.1
      - type: static
        src: dmz
        real_ip: 10.44.30.10
        mapped_ip: 45.83.220.5
      policy:
      - src: external
        dst: dmz
        ports:
        - 80
        - 443
        action: permit
      - src: workstations
        dst: servers
        ports:
        - 53
        - 88
        - 389
        - 445
        - 8080
        action: permit
      - src: workstations
        dst: external
        ports:
        - 80
        - 443
        - 53
        action: permit
      - src: servers
        dst: external
        ports:
        - 80
        - 443
        - 53
        - 123
        action: permit
      - src: dmz
        dst: servers
        ports:
        - 53
        - 88
        - 389
        - 445
        - 3389
        action: permit
      - src: servers
        dst: servers
        ports:
        - 53
        - 88
        - 389
        - 445
        action: permit
time_window:
  start: '2024-05-27T12:00:00Z'
  duration: 2h
  warmup: 1h
baseline_activity:
  description: Normal branch office workday traffic with web browsing through the
    proxy, file share access, domain authentication, public web visitors, and modest
    suspicious background noise.
  intensity: low
  variation: low
  suspicious_noise: medium
  traffic_rates:
    web: low
    user_activity: low
    persona_connections: low
observation_profile: complete
logon_grace_period: 45m
storyline:
- id: remote-session
  time: +5m
  actor: nina.kapoor
  system: FILE-BO-01
  activity: Remote access to the file server
  events:
  - type: rdp_session
    source_ip: 10.44.10.24
    technique: T1021.001
- id: discovery
  time: +7m
  actor: nina.kapoor
  system: FILE-BO-01
  activity: Inventory the claims directory
  events:
  - type: process
    process_name: C:\Windows\System32\cmd.exe
    command_line: cmd.exe /c dir C:\Claims /s
    technique: T1083
- id: collection
  time: +9m
  actor: nina.kapoor
  system: FILE-BO-01
  activity: Stage an archive of the claims directory
  events:
  - type: process
    process_name: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    command_line: powershell.exe -NoProfile -Command Compress-Archive -Path C:\Claims
      -DestinationPath C:\Windows\Temp\claims-stage.zip -Force
    technique: T1560.001
red_herrings: []
output:
  logs:
  - format: windows
  - format: ecar
  - format: zeek
  destination: generated/attack-cmd
  compression: false
